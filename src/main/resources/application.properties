spring.application.name=corebank
server.port=8088
logging.level.root=info
logging.charset.console=utf-8
logging.pattern.console=%d{dd MMM yyyy HH:mm:ss.SSS} [%X{uuid}] DLP %c[%M]: %p %m%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# Datasource (H2 en memoria)
spring.datasource.url=jdbc:h2:mem:corebank;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.hibernate.naming.physical-strategy=com.ithink.corebank.security.ConfigPropertiesValues

# Flyway
spring.flyway.enabled=true
spring.flyway.schemas=dbo
spring.flyway.default-schema=dbo
spring.flyway.clean-on-startup=true
spring.flyway.clean-disabled=false

# SpringDoc / Swagger UI (demo)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.doc-expansion=list
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.display-request-duration=true
# La demo abre en el core bancario publicado con BIAN
springdoc.swagger-ui.urlsPrimaryName=03-BIAN
